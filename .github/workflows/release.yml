# Release publish (implements the release half of CI_CD.md).
#
# Manually triggered on the default branch: Actions -> release -> Run workflow
# (the UI only offers workflow_dispatch on the default branch; via CLI:
# `gh workflow run release.yml --ref main`). The nightly scheduled run lives in
# build.yml and stays automatic — this workflow is the human gate before a
# version is published.
#
# It reads the dbt version from rockcraft.yaml on main, promotes the
# pr-<n>-<variant>-<arch> images that build.yml pushed for the merged PR into
# multi-arch manifests ghcr.io/<owner>/dbt:<version>-<variant> (no bare
# <version> or :latest tag), seeds ghcr.io/<owner>/dbt:latest-<variant> from
# them (the nightly build re-points latest-<variant> at each new nightly),
# deletes the temporary pr-<n> tags via the Packages API (GHCR has no registry
# DELETE endpoint; the package is repo-linked and workflow-published, so the
# default GITHUB_TOKEN with packages: write can delete its versions), and
# creates the git tag + GitHub release.
# Which PR to release is the optional pr_number input; by default it picks the
# newest merged PR that still has pr-* images in GHCR. Idempotent: skips when
# the version tag already exists.
# The .rock files are not attached to the GitHub release (22 rocks would exceed
# asset limits) — pull them from ghcr instead.
name: release

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged PR whose pr-<n>-* images to promote (default: newest merged PR that still has pr-* images in GHCR)'
        required: false
        type: string

concurrency:
  group: release # one release at a time; queue manual runs instead of cancelling

permissions:
  contents: write
  packages: write

# run steps execute with bash — job containers default to sh (dash)
defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dbt
  # The job runs inside the shared builder image
  # ghcr.io/<owner>/dbt-rock-builder:v1 (builder/Dockerfile, built by
  # builder-image.yml), so skopeo/docker/gh/git/jq are preinstalled and no
  # step apt-installs anything on the runner.

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/dbt-rock-builder:v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - name: resolve which merged PR to release
        id: pr
        run: |
          if [ -n "${PR_NUMBER_INPUT}" ]; then
            echo "pr_number input: ${PR_NUMBER_INPUT}"
            echo "number=${PR_NUMBER_INPUT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          # PR numbers that still have pr-<n>-* images in GHCR ...
          tagged=$(skopeo list-tags "docker://${IMAGE}" \
            | jq -r '.Tags[] | select(startswith("pr-")) | sub("^pr-"; "") | split("-")[0] | tonumber? // empty' \
            | sort -un | jq -Rnc '[inputs | tonumber]')
          # ... intersected with merged PRs, newest first
          merged=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" \
            --jq '[.[] | select(.merged_at != null) | .number]')
          n=$(jq -rn --argjson t "$tagged" --argjson m "$merged" \
            '$t | map(select(. as $n | $m | index($n))) | max // empty')
          if [ -z "$n" ]; then
            echo "no merged PR with pr-* images found in ${IMAGE}; pass the pr_number input explicitly" >&2
            exit 1
          fi
          echo "releasing newest merged PR with pr-* images: PR #${n}"
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - name: resolve version from rockcraft.yaml
        id: ver
        run: |
          v=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' rockcraft.yaml | head -n 1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: skip if the tag already exists
        id: skip
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          if git ls-remote --exit-code origin "refs/tags/${V}" >/dev/null 2>&1; then
            echo "tag ${V} already released; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: promote pr images to version-tagged multi-arch manifests
        id: promote
        if: steps.skip.outputs.skip != 'true'
        env:
          V: ${{ steps.ver.outputs.version }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          # discover variants from the pr-tagged per-arch images pushed by build.yml
          variants=$(skopeo list-tags "docker://${IMAGE}" \
            | jq -r --arg p "pr-${PR_NUMBER}-" '.Tags[] | select(startswith($p)) | select(endswith("-amd64"))
                      | sub("^" + $p; "") | sub("-amd64$"; "")' | sort -u)
          if [ -z "$variants" ]; then
            echo "no pr-${PR_NUMBER}-* images found in ${IMAGE} — did the build workflow run?" >&2
            exit 1
          fi
          echo "variants: $variants"
          for variant in $variants; do
            docker manifest create "${IMAGE}:${V}-${variant}" \
              "${IMAGE}:pr-${PR_NUMBER}-${variant}-amd64" "${IMAGE}:pr-${PR_NUMBER}-${variant}-arm64"
            docker manifest annotate "${IMAGE}:${V}-${variant}" "${IMAGE}:pr-${PR_NUMBER}-${variant}-amd64" --os linux --arch amd64
            docker manifest annotate "${IMAGE}:${V}-${variant}" "${IMAGE}:pr-${PR_NUMBER}-${variant}-arm64" --os linux --arch arm64
            docker manifest push "${IMAGE}:${V}-${variant}"
            # seed latest-<variant> from the release manifest; the nightly build
            # re-points it at each new nightly of the version pinned on main.
            # NB: a manifest list cannot reference another manifest list via
            # `docker manifest create`, so copy the list as-is with skopeo
            skopeo copy --all "docker://${IMAGE}:${V}-${variant}" "docker://${IMAGE}:latest-${variant}"
          done
      # GHCR does not support the registry DELETE endpoint (skopeo delete fails
      # with "unsupported"), so pr-* tags are removed via the Packages API.
      # The dbt package is repository-linked and published by build.yml, so the
      # repository has admin on it and the default GITHUB_TOKEN (packages: write)
      # is allowed to delete versions. Deletes all pr-* tags of closed/merged
      # PRs (stale orphans included); tags of still-open PRs are kept.
      - name: delete pr-* image tags via Packages API
        if: steps.skip.outputs.skip != 'true'
        run: bash scripts/cleanup-tags.sh "${IMAGE##*/}" pr
      - name: git tag + GitHub release
        if: steps.skip.outputs.skip != 'true'
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          img="ghcr.io/${{ github.repository_owner }}/dbt"
          {
            echo "## dbt OSS ${V} as chiselled rocks"
            echo
            echo "One multi-arch (linux/amd64 + linux/arm64) image per ADBC driver variant:"
            echo
            while read -r variant; do
              [ -n "$variant" ] || continue
              echo "- \`${img}:${V}-${variant}\`"
            done < scripts/variants.txt
            echo
            echo "- \`duckdb\` ships both the \`duckdb\` and \`duckdb_extended\` drivers"
            echo "- \`${img}:latest-<variant>\` tracks the newest nightly build of the latest dbt version"
            echo "- Tarball and driver SHA256 checksums: \`/var/lib/dbt/provenance\` inside each image"
          } > /tmp/release-notes.md
          git tag "$V" && git push origin "$V"
          gh release create "$V" --title "dbt-rock ${V}" --notes-file /tmp/release-notes.md
