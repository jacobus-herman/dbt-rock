# Release publish (implements the release half of CI_CD.md).
#
# Runs when a PR to the default branch is merged. It reads the dbt version from
# rockcraft.yaml, promotes the pr-<n>-<variant>-<arch> images that build.yml
# pushed into multi-arch manifests ghcr.io/<owner>/dbt:<version>-<variant>
# (no bare <version> or :latest tag), seeds ghcr.io/<owner>/dbt:latest-<variant>
# from them (the nightly build re-points latest-<variant> at each new nightly),
# deletes the temporary pr-<n> tags, and creates the git tag + GitHub release.
# The .rock files are not attached to the GitHub release (22 rocks would exceed
# asset limits) — pull them from ghcr instead.
name: release

on:
  pull_request:
    types: [closed]
    branches: [main] # keep in sync with the repo's default branch

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dbt

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
      - name: resolve version from rockcraft.yaml
        id: ver
        run: |
          v=$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' rockcraft.yaml | head -n 1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: skip if the tag already exists
        id: skip
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          if git ls-remote --exit-code origin "refs/tags/${V}" >/dev/null 2>&1; then
            echo "tag ${V} already released; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: install skopeo
        if: steps.skip.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: promote pr images to version-tagged multi-arch manifests
        if: steps.skip.outputs.skip != 'true'
        env:
          V: ${{ steps.ver.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          # discover variants from the pr-tagged per-arch images pushed by build.yml
          variants=$(skopeo list-tags "docker://${IMAGE}" \
            | jq -r --arg p "pr-${PR_NUMBER}-" '.Tags[] | select(startswith($p)) | select(endswith("-amd64"))
                      | sub("^" + $p; "") | sub("-amd64$"; "")' | sort -u)
          if [ -z "$variants" ]; then
            echo "no pr-${PR_NUMBER}-* images found in ${IMAGE} — did the build workflow run?" >&2
            exit 1
          fi
          echo "variants: $variants"
          for variant in $variants; do
            docker manifest create "${IMAGE}:${V}-${variant}" \
              "${IMAGE}:pr-${PR_NUMBER}-${variant}-amd64" "${IMAGE}:pr-${PR_NUMBER}-${variant}-arm64"
            docker manifest annotate "${IMAGE}:${V}-${variant}" "${IMAGE}:pr-${PR_NUMBER}-${variant}-amd64" --os linux --arch amd64
            docker manifest annotate "${IMAGE}:${V}-${variant}" "${IMAGE}:pr-${PR_NUMBER}-${variant}-arm64" --os linux --arch arm64
            docker manifest push "${IMAGE}:${V}-${variant}"
            # seed latest-<variant> from the release manifest; the nightly build
            # re-points it at each new nightly of the version pinned on main
            docker manifest create "${IMAGE}:latest-${variant}" "${IMAGE}:${V}-${variant}"
            docker manifest push "${IMAGE}:latest-${variant}"
            # temporary pr tags are no longer needed once the version manifest exists
            skopeo delete "docker://${IMAGE}:pr-${PR_NUMBER}-${variant}-amd64" || echo "warn: could not delete pr tag (amd64)"
            skopeo delete "docker://${IMAGE}:pr-${PR_NUMBER}-${variant}-arm64" || echo "warn: could not delete pr tag (arm64)"
          done
      - name: git tag + GitHub release
        if: steps.skip.outputs.skip != 'true'
        env:
          V: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          variants=$(paste -sd', ' scripts/variants.txt)
          git tag "$V" && git push origin "$V"
          gh release create "$V" \
            --title "dbt-rock ${V}" \
            --notes "dbt OSS ${V} as chiselled rocks, one image per ADBC driver variant: \`ghcr.io/${{ github.repository_owner }}/dbt:${V}-<variant>\` (variants: ${variants}; \`duckdb\` ships both duckdb and duckdb_extended). \`latest-<variant>\` tracks the newest nightly of the latest version. Tarball and driver checksums: /var/lib/dbt/provenance in each image."
